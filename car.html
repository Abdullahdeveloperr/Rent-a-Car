<!DOCTYPE html>
<html>
<head>
  <title>Cars List</title>
  <style>
    .grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
    .card { padding: 15px; border: 1px solid #ccc; text-decoration: none; color: rgb(255, 255, 255); }
    .card img { width: 100%; height: 150px; object-fit: cover; }
  </style>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Car List</h1>

<div id="fleetGrid" class="grid"></div>


<script>
  
// ===============================
// LOAD JSON
// ===============================
let cars = [];
let currentIndex = 0;

fetch("js/cars.json")
  .then(res => res.json())
  .then(data => {
    cars = data;

    if (document.getElementById("fleetGrid")) {
      loadCarsList();
    }

    if (document.getElementById("carName")) {
      loadSingleCar();
    }
  });


// ===============================
// 1. INDEX PAGE (CAR LIST)
// ===============================
function loadCarsList() {
  const grid = document.getElementById("fleetGrid");

  grid.innerHTML = cars.map(car => `
    <a class="card" href="car.html?id=${car.id}">
      <img src="${car.images[0]}">
      <h3>${car.name}</h3>
      <p>${car.type}</p>
      <p>PKR ${car.price}/day</p>
    </a>
  `).join('');
}


// ===============================
// 2. SINGLE CAR PAGE
// ===============================
function loadSingleCar() {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const car = cars.find(c => c.id === id);
  if (!car) return;

  document.getElementById("carName").textContent = car.name;
  document.getElementById("carType").textContent = car.type;
  document.getElementById("carPrice").textContent = car.price;
  document.getElementById("carDesc").textContent = car.description;

  document.getElementById("carFeatures").innerHTML =
    car.features.map(f => `<li>${f}</li>`).join('');

  document.getElementById("bookBtn").href =
    `https://wa.me/923190146277?text=I want to book ${car.name}`;

  // slider setup
  currentIndex = 0;
  window.currentImages = car.images;

  showImage();
}


// ===============================
// IMAGE SLIDER
// ===============================
function showImage() {
  document.getElementById("carImage").src =
    window.currentImages[currentIndex];
}

function next() {
  currentIndex = (currentIndex + 1) % window.currentImages.length;
  showImage();
}

function prev() {
  currentIndex =
    (currentIndex - 1 + window.currentImages.length) %
    window.currentImages.length;
  showImage();
}
</script>
<script src="js/script.js"></script>
</body>
</html>
